<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure AI Tool Execution and Permission Sandbox" />
    <meta name="color-scheme" content="dark light" />
    <title>Secure AI Tool Execution &amp; Permission Sandbox</title>
    <script>
      // Apply the persisted theme before the first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("saxis-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored || (prefersLight ? "light" : "dark");
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
