# ---------------------------------------------------------------------------
# Development stack.
#
#   docker compose up --build
#
# The backend binds to 127.0.0.1 by default: it is not exposed to the
# network.  The frontend is reachable at http://127.0.0.1:8080.
# ---------------------------------------------------------------------------
name: secure-ai-sandbox

services:
  # The hardened image every sandboxed execution runs in.  It is built once
  # and then reused; the backend only ever starts containers from it.
  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: secure-ai-sandbox-runner:latest
    # The image is only built here; the container does nothing.
    entrypoint: ["/bin/true"]
    command: []
    restart: "no"

  # The Docker daemon resolves every bind mount source on the *host*, so the
  # per-job workspace directory must exist on the host and be writable by the
  # control plane user.  This one-shot service prepares it.
  job-root-init:
    image: busybox:1.36
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/saxis-jobs &&
        chmod 1777 /tmp/saxis-jobs &&
        echo "the per-job workspace directory is ready"
    volumes:
      - /tmp/saxis-jobs:/tmp/saxis-jobs
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: secure-ai-sandbox-backend:dev
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      job-root-init:
        condition: service_completed_successfully
    environment:
      SAXIS_ENVIRONMENT: development
      SAXIS_SECRET_KEY: ${SAXIS_SECRET_KEY:?set SAXIS_SECRET_KEY in .env}
      SAXIS_PROVIDER_SECRET_KEY: ${SAXIS_PROVIDER_SECRET_KEY:-}
      SAXIS_DATABASE_URL: sqlite:////app/data/sandbox.db
      SAXIS_WORKSPACE_ROOT: /workspace
      SAXIS_ARTIFACT_ROOT: /app/data/artifacts
      # The job root and the seccomp profile MUST be mounted at the same
      # absolute path on the host and in the container: the Docker daemon
      # resolves every bind mount source on the host filesystem.
      SAXIS_JOB_ROOT: /tmp/saxis-jobs
      SAXIS_SANDBOX_SECCOMP_PROFILE_PATH: /etc/saxis/seccomp.json
      SAXIS_AUTH_MODE: ${SAXIS_AUTH_MODE:-multiuser}
      SAXIS_BOOTSTRAP_ADMIN_USERNAME: ${SAXIS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SAXIS_BOOTSTRAP_ADMIN_PASSWORD: ${SAXIS_BOOTSTRAP_ADMIN_PASSWORD:-admin-change-me}
      SAXIS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SAXIS_SANDBOX_BACKEND: docker
      SAXIS_SANDBOX_IMAGE: secure-ai-sandbox-runner:latest
      SAXIS_DEFAULT_PROVIDER: ${SAXIS_DEFAULT_PROVIDER:-ollama}
      SAXIS_PROVIDER_BASE_URL: ${SAXIS_PROVIDER_BASE_URL:-http://host.docker.internal:11434/v1}
      SAXIS_PROVIDER_MODEL: ${SAXIS_PROVIDER_MODEL:-qwen2.5:1.5b}
      SAXIS_PROVIDER_API_KEY: ${SAXIS_PROVIDER_API_KEY:-}
    # The control plane needs to reach the Docker socket to start the sandbox
    # containers.  The supplementary group is the group that owns the socket on
    # the host (see `stat -c %g /var/run/docker.sock`).
    group_add:
      - "${SAXIS_DOCKER_GID:-999}"
    volumes:
      # The approved workspace is mounted read-only into the control plane.
      - ./sandbox_workspace:/workspace:ro
      - backend-data:/app/data
      # The broker needs the Docker socket to start sandbox containers.
      # It is never mounted into a sandbox worker.
      - /var/run/docker.sock:/var/run/docker.sock
      # The per-job workspace must exist at the same path on the host,
      # because the daemon resolves the bind mount source on the host.
      - /tmp/saxis-jobs:/tmp/saxis-jobs
      # The hardened seccomp profile is read by the daemon, so it must be
      # reachable at the same absolute path on the host.
      - ./docker/seccomp/sandbox.json:/etc/saxis/seccomp.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: secure-ai-sandbox-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  backend-data:
